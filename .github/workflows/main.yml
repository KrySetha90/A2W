name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Download AI models (Real-ESRGAN + RIFE)
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail -o app/src/main/assets/realesrgan.onnx https://huggingface.co/momoapps/optimix-models/resolve/main/realesr-general-x4v3.onnx
          curl -L --fail -o app/src/main/assets/rife.onnx https://huggingface.co/edgetools/rife/resolve/main/rife49.onnx
          ls -la app/src/main/assets
          test $(stat -c%s app/src/main/assets/realesrgan.onnx) -gt 1000000
          test $(stat -c%s app/src/main/assets/rife.onnx) -gt 1000000
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Enhancer build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
